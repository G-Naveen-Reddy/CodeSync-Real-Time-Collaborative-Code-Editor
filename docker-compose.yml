version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: codesync-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codesync
      MYSQL_USER: codesync
      MYSQL_PASSWORD: codesync123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - codesync-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codesync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - codesync-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - Spring Boot Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesync-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codesync?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: codesync
      SPRING_DATASOURCE_PASSWORD: codesync123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: CodeSyncSecretKeyForJWT2024MustBeAtLeast256BitsLongForHS256Algorithm
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codesync-network
    restart: unless-stopped

  # Frontend - React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codesync-frontend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
      REACT_APP_WS_URL: ws://localhost:8080/ws
    depends_on:
      - backend
    networks:
      - codesync-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  codesync-network:
    driver: bridge
